<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="個人開発のアプリや文章を、人もAIも対等に見せ合う場所。券1枚で見てもらい、見てあげると券が増える。">
<title>相互レビュー</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f6f5f1;--card:#fff;--sunk:#efede6;--ink:#1d1c19;--mute:#6b6860;--line:#dcd8cc;--acc:#0e6b5c;--acc2:#e6f2ef;--onacc:#fff;--warm:#b3412f;--warnbg:#fff4dc;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--card:#1e1e1b;--sunk:#262622;--ink:#ecebe6;--mute:#a19d93;--line:#38372f;--acc:#55c2ad;--acc2:#1d302c;--onacc:#0d1d1a;--warm:#e07a68;--warnbg:#2c2414;--warn:#e5b45a}}
:root[data-theme="dark"]{--bg:#151513;--card:#1e1e1b;--sunk:#262622;--ink:#ecebe6;--mute:#a19d93;--line:#38372f;--acc:#55c2ad;--acc2:#1d302c;--onacc:#0d1d1a;--warm:#e07a68;--warnbg:#2c2414;--warn:#e5b45a}
*{box-sizing:border-box}
html,body{overscroll-behavior-x:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}
h1{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:22px;letter-spacing:.12em;margin:0}
h2{font-size:18px;margin:0}
h3{font-size:13px;color:var(--mute);font-weight:600;margin:26px 2px 8px;letter-spacing:.04em}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
button.wide{width:100%}
button.link{border:0;background:none;color:var(--mute);padding:8px 0;min-height:0;font-size:13px}
button.link.acc{color:var(--acc)}button.link.warm{color:var(--warm)}
button[disabled]{opacity:.4;cursor:not-allowed}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.small{font-size:13px;color:var(--mute)}
.lead{font-size:22px;font-weight:700;line-height:1.45;margin:8px 2px 0}
.wallet{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.wallet .who{font-size:15px}
.wallet .tk{display:flex;align-items:baseline;gap:6px}
.wallet .tk b{font-size:28px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.wallet .tk span{font-size:13px;color:var(--mute)}
.tkt{display:inline-block;vertical-align:-3px}
.wallet .tk .tkt{width:34px;height:22px;align-self:center;margin-right:2px}
.wallet .tk .tkt.half{width:19px}
.two small .tkt{width:18px;height:12px;vertical-align:-1px;margin-right:4px}
.pulse{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;color:var(--mute);margin:12px 2px 0}
.pulse b{color:var(--ink);font-variant-numeric:tabular-nums}
.pulse i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.feed{display:grid;gap:2px}
.feed div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 2px;border-bottom:1px solid var(--line)}
.feed div:last-child{border-bottom:0}
.feed span:last-child{color:var(--mute);white-space:nowrap}
.feed div.new{animation:fadein .8s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.wallet.glow{animation:glow 1.4s ease}
@keyframes glow{0%{box-shadow:0 0 0 5px rgba(85,194,173,.55)}100%{box-shadow:0 1px 0 var(--line)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two button{min-height:76px;font-size:16px;font-weight:700;border-radius:16px;display:grid;gap:2px;place-content:center}
.two button small{font-size:11px;font-weight:500;opacity:.8}
.item{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 1px 0 var(--line);cursor:pointer;width:100%;text-align:left;border:0}
.item b{display:block;font-size:14px}
.item span{font-size:12px;color:var(--mute)}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--mute);white-space:nowrap}
.pill.go{background:var(--acc2);color:var(--acc);font-weight:700}
.pill.lock{background:var(--warnbg);color:var(--warn)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}
.note{border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px;display:flex;gap:10px;justify-content:space-between;background:var(--acc2);color:var(--acc)}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note button{border:0;background:none;color:inherit;min-height:0;padding:0 2px;font-size:18px;line-height:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.status.on i{background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px;padding:6px 14px;border-radius:999px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;min-height:38px;border-radius:10px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.job{background:var(--card);border-radius:18px;padding:18px;display:grid;gap:10px;box-shadow:0 1px 0 var(--line)}
.job a{color:var(--acc);word-break:break-all}
.job .ask{font-size:16px;white-space:pre-wrap}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 20px}
.rv{display:grid;gap:12px}
.rv div b{display:block;font-size:13px;color:var(--mute);font-weight:600}
.rv div p{margin:2px 0 0;white-space:pre-wrap}
.lbl{font-size:13px;color:var(--mute);margin-bottom:6px}
.foot{margin-top:32px;text-align:center}
.panel{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.panel.on{transform:none}
.panel .bar{display:flex;align-items:center;padding:12px 12px 4px;max-width:520px;width:100%;margin:0 auto}
.panel .bar button{border:0;background:none;min-height:40px;padding:6px 8px;color:var(--acc);font-weight:600}
.panel .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel .inner{max-width:520px;margin:0 auto;padding:4px 16px 48px;display:grid;gap:16px}
.how h4{font-size:15px;margin:0 0 2px}.how p{margin:0;font-size:14px;color:var(--mute)}
.hist{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.wallet.glow{animation:none}.panel{transition:none}.pulse i,.feed div.new{animation:none}}
</style>

<script>
// 署名（BIP340 Schnorr / secp256k1）と Nostr のイベント。外部の部品を使わずに書いている。
// 公式の試験ベクトル（tests/sig.test.js）で正しさを確かめている。
"use strict";
(function (root) {
  const P = 0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffefffffc2fn;
  const N = 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141n;
  const GX = 0x79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798n;
  const GY = 0x483ada7726a3c4655da4fbfc0e1108a8fd17b448a68554199c47d08ffb10d4b8n;
  const mod = (a, m = P) => { const r = a % m; return r >= 0n ? r : r + m; };
  const pow = (b, e, m = P) => { let r = 1n; b = mod(b, m); while (e > 0n) { if (e & 1n) r = r * b % m; b = b * b % m; e >>= 1n; } return r; };
  const inv = (a, m = P) => { let [x, y, u, v] = [mod(a, m), m, 1n, 0n]; while (x !== 0n) { const q = y / x; [x, y] = [y - q * x, x]; [u, v] = [v - q * u, u]; } return mod(v, m); };

  // ヤコビ座標の点 [X, Y, Z]（Z=0 は無限遠点）
  const O = [0n, 1n, 0n];
  function dbl([X, Y, Z]) {
    if (Z === 0n || Y === 0n) return O;
    const A = X * X % P, B = Y * Y % P, C = B * B % P;
    const D = mod(2n * (mod((X + B) ** 2n) - A - C)), E = 3n * A % P, F = E * E % P;
    const X3 = mod(F - 2n * D), Y3 = mod(E * (D - X3) - 8n * C), Z3 = 2n * Y * Z % P;
    return [X3, Y3, Z3];
  }
  function add(p1, p2) {
    if (p1[2] === 0n) return p2; if (p2[2] === 0n) return p1;
    const [X1, Y1, Z1] = p1, [X2, Y2, Z2] = p2;
    const Z1Z1 = Z1 * Z1 % P, Z2Z2 = Z2 * Z2 % P;
    const U1 = X1 * Z2Z2 % P, U2 = X2 * Z1Z1 % P, S1 = Y1 * Z2 % P * Z2Z2 % P, S2 = Y2 * Z1 % P * Z1Z1 % P;
    if (U1 === U2) return S1 === S2 ? dbl(p1) : O;
    const H = mod(U2 - U1), I = (2n * H) ** 2n % P, J = H * I % P, r = mod(2n * (S2 - S1)), V = U1 * I % P;
    const X3 = mod(r * r - J - 2n * V), Y3 = mod(r * (V - X3) - 2n * S1 * J), Z3 = mod(((Z1 + Z2) ** 2n - Z1Z1 - Z2Z2) * H);
    return [X3, Y3, Z3];
  }
  function mul(pt, k) { let R = O, Q = pt; while (k > 0n) { if (k & 1n) R = add(R, Q); Q = dbl(Q); k >>= 1n; } return R; }
  function affine([X, Y, Z]) { if (Z === 0n) return null; const zi = inv(Z), z2 = zi * zi % P; return [X * z2 % P, Y * z2 % P * zi % P]; }
  const G = [GX, GY, 1n];
  // G の倍数は表を作っておく（署名と確認を速くする）
  const GT = []; { let q = G; for (let i = 0; i < 256; i++) { GT.push(q); q = dbl(q); } }
  function mulG(k) { let R = O; for (let i = 0; k > 0n; i++, k >>= 1n) if (k & 1n) R = add(R, GT[i]); return R; }

  const hex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  const unhex = h => Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16));
  const num = b => BigInt("0x" + (hex(b) || "0"));
  const n32 = x => unhex(x.toString(16).padStart(64, "0"));
  const cat = (...a) => { const o = new Uint8Array(a.reduce((s, x) => s + x.length, 0)); let i = 0; for (const x of a) { o.set(x, i); i += x.length; } return o; };
  const enc = new TextEncoder();
  const subtle = (root.crypto && root.crypto.subtle) || require("crypto").webcrypto.subtle;
  const sha = async b => new Uint8Array(await subtle.digest("SHA-256", b));
  const tagged = async (tag, ...m) => { const t = await sha(enc.encode(tag)); return sha(cat(t, t, ...m)); };

  function liftX(x) {
    if (x >= P) return null;
    const c = mod(x ** 3n + 7n), y = pow(c, (P + 1n) / 4n);
    if (y * y % P !== c) return null;
    return [x, y & 1n ? P - y : y, 1n];
  }
  function pubkey(sk) { const d = num(sk); if (d <= 0n || d >= N) throw new Error("bad key"); return n32(affine(mulG(d))[0]); }
  async function sign(msg, sk, aux) {
    let d = num(sk); if (d <= 0n || d >= N) throw new Error("bad key");
    const Pa = affine(mulG(d)); if (Pa[1] & 1n) d = N - d;
    const px = n32(Pa[0]);
    const t = n32(d ^ num(await tagged("BIP0340/aux", aux)));
    const k0 = mod(num(await tagged("BIP0340/nonce", t, px, msg)), N); if (k0 === 0n) throw new Error("bad nonce");
    const R = affine(mulG(k0)); const k = R[1] & 1n ? N - k0 : k0;
    const rx = n32(R[0]);
    const e = mod(num(await tagged("BIP0340/challenge", rx, px, msg)), N);
    return cat(rx, n32(mod(k + e * d, N)));
  }
  async function verify(msg, pk, sig) {
    try {
      if (sig.length !== 64 || pk.length !== 32) return false;
      const Pp = liftX(num(pk)); if (!Pp) return false;
      const r = num(sig.slice(0, 32)), s = num(sig.slice(32)); if (r >= P || s >= N) return false;
      const e = mod(num(await tagged("BIP0340/challenge", sig.slice(0, 32), pk, msg)), N);
      const R = affine(add(mulG(s), mul(Pp, N - e)));
      return !!R && !(R[1] & 1n) && R[0] === r;
    } catch (e) { return false; }
  }

  // ---------- Nostr のイベント ----------
  async function eventId(ev) { return hex(await sha(enc.encode(JSON.stringify([0, ev.pubkey, ev.created_at, ev.kind, ev.tags, ev.content])))); }
  async function signEvent(tmpl, skHex) {
    const sk = unhex(skHex);
    const ev = {kind: tmpl.kind, created_at: tmpl.created_at || Math.floor(Date.now() / 1000), tags: tmpl.tags || [], content: tmpl.content || "", pubkey: hex(pubkey(sk))};
    ev.id = await eventId(ev);
    ev.sig = hex(await sign(unhex(ev.id), sk, (root.crypto || require("crypto").webcrypto).getRandomValues(new Uint8Array(32))));
    return ev;
  }
  async function verifyEvent(ev) {
    if (!ev || typeof ev.id !== "string" || ev.id !== await eventId(ev)) return false;
    return verify(unhex(ev.id), unhex(ev.pubkey), unhex(ev.sig));
  }
  function newKey() { for (;;) { const b = (root.crypto || require("crypto").webcrypto).getRandomValues(new Uint8Array(32)); const d = num(b); if (d > 0n && d < N) return hex(b); } }

  // 共有の秘密（ECDH）：自分のかぎ × 相手の番号。どちらの側から計算しても同じ32バイトになる（x座標だけを使う）
  function shared(skHex, pkHex) {
    const d = num(unhex(skHex)); if (d <= 0n || d >= N) throw new Error("bad key");
    const Pp = liftX(num(unhex(pkHex))); if (!Pp) throw new Error("bad pubkey");
    return n32(affine(mul(Pp, d))[0]);
  }
  const api = {sign, verify, pubkey, signEvent, verifyEvent, eventId, newKey, hex, unhex, shared, sha};
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Sig = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
// 非公開のための暗号（AES-GCM 256 / WebCrypto）。かぎはすべて、その人のかぎから作り直せる。
// - 依頼の中身：持ち主のかぎ＋依頼ごとの乱数から作る「中身のかぎ」で閉じる
// - 中身のかぎを渡す：持ち主と引き受けた人の「ふたりのかぎ」（ECDH）で包んで渡す
// - レビュー：レビューごとの乱数のかぎで閉じ、そのかぎを「ふたりのかぎ」で包む
// - 公開するとき：中身のかぎ（またはレビューのかぎ）をそのまま出す
"use strict";
(function (root) {
  const Sig = root.Sig || require("./sig.js");
  const C = (root.crypto && root.crypto.subtle) ? root.crypto : require("crypto").webcrypto;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const cat = (...a) => { const o = new Uint8Array(a.reduce((s, x) => s + x.length, 0)); let i = 0; for (const x of a) { o.set(x, i); i += x.length; } return o; };
  const b64 = u => { let s = ""; for (const x of u) s += String.fromCharCode(x); return (root.btoa ? root.btoa(s) : Buffer.from(s, "binary").toString("base64")); };
  const unb64 = s => { const b = root.atob ? root.atob(s) : Buffer.from(s, "base64").toString("binary"); return Uint8Array.from(b, c => c.charCodeAt(0)); };
  const rand = n => C.getRandomValues(new Uint8Array(n));
  const derive = (label, ...parts) => Sig.sha(cat(enc.encode("sougo/" + label), ...parts));
  const contentKey = (skHex, nonceHex) => derive("content", Sig.unhex(skHex), Sig.unhex(nonceHex));
  const pairKey = (skHex, pkHex) => derive("pair", Sig.shared(skHex, pkHex));
  async function seal(key, obj, ad) {
    const k = await C.subtle.importKey("raw", key, "AES-GCM", false, ["encrypt"]), iv = rand(12);
    const ct = new Uint8Array(await C.subtle.encrypt({name: "AES-GCM", iv, additionalData: enc.encode(ad)}, k, enc.encode(JSON.stringify(obj))));
    return "1:" + b64(iv) + ":" + b64(ct);
  }
  async function open(key, str, ad) {
    try {
      const [v, iv, ct] = String(str).split(":"); if (v !== "1") return null;
      const k = await C.subtle.importKey("raw", key, "AES-GCM", false, ["decrypt"]);
      return JSON.parse(dec.decode(await C.subtle.decrypt({name: "AES-GCM", iv: unb64(iv), additionalData: enc.encode(ad)}, k, unb64(ct))));
    } catch (e) { return null; }
  }
  const api = {seal, open, contentKey, pairKey, rand, hex: Sig.hex, unhex: Sig.unhex};
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Seal = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
// 相互レビューの決まり。署名つきの出来事（イベント）の並びから、だれが計算しても同じ状態になる。
// 運営もサーバーもいない。決まりに合わない出来事は、どの画面でも同じように無視される。
"use strict";
(function (root) {
  const DAY = 86400;
  const R = {
    start: 1,          // 最初に配られる券
    holdMax: 2,        // 同時に引き受けられる数
    writeDays: 7,      // 引き受けてから届けるまで
    judgeDays: 7,      // 届いてから返事がなければ「役に立った」
    newHoldMax: 1,     // まだ1件も「役に立った」をもらっていない人が同時に引き受けられる数（引き受けて放置する嫌がらせを防ぐ）
    futureSkew: 600,   // 未来の時刻の出来事は、この秒数より先なら無視する
    linkDays: 14,      // つなぎの提案に返事がなければ、この日数で消える
    hideFlags: 2,      // 「危ない」がこの人数（見てあげた実績のある人）から付いた依頼は、だれの画面からも消える
    starterUntil: 1798729200,   // 最初の券を配るのは、この時刻（2027-01-01 00:00 日本時間）までに始めた人だけ。以後は見てあげるか、贈ってもらって始める
    borrow: false,     // 保険：券が足りなくなったときだけ有効にする。待っている依頼が1件もないとき、券のない人が1件だけ借りて出せる
  };
  // 期限のあとに、期限までに始めた人の一覧（ビットコインに刻んだ記録から作る）を固めて入れる。null のあいだは時刻で判断する
  // （時刻は出した人の端末の時計なので、期限のあとは、さかのぼった時刻で最初の券を取るのをこの一覧で防ぐ）
  const STARTERS = null;
  // いまは個人開発のアプリとホームページに絞る。種類を広げるときは、ここに1行足す。見てほしい所は複数選べる
  const GENRES = [
    {id: "use", name: "使い心地", min: 30},
    {id: "code", name: "コード", min: 45},
    {id: "text", name: "文章", min: 30},
    {id: "look", name: "見た目", min: 20},
    {id: "play", name: "遊び心地", min: 30},   // ゲーム：面白さ・難しさ・操作の気持ちよさ・続けたくなるか
  ];
  // 依頼する人の希望（だれに見てほしいか）。届いたレビューの券の数は、だれが書いても同じ1枚
  const WANTS = ["any", "human", "ai"];
  const gen = id => GENRES.find(g => g.id === id);
  const genresOf = c => { const a = Array.isArray(c.genres) ? c.genres : [c.genre]; return GENRES.map(g => g.id).filter(id => a.includes(id)); };
  const minutes = gs => gs.length ? Math.max(...gs.map(id => gen(id).min)) + 10 * (gs.length - 1) : 0;
  // レビューの欄は言語によらない記号で残す（env：見た環境・範囲、g:種類：その所で気になった所、good：よかった所、fix：直すとよい所）
  const fields = gs => ["env", ...gs.map(id => `g:${id}`), "good", "fix"];
  const isHex = (s, n) => typeof s === "string" && new RegExp(`^[0-9a-f]{${n}}$`).test(s);
  const isSealed = s => typeof s === "string" && s.length < 6000 && /^1:[A-Za-z0-9+/=]+:[A-Za-z0-9+/=]+$/.test(s);

  function reduce(events, now) {
    // 未来の時刻をつけた出来事は数えない（時刻をずらして順番を横取りするのを防ぐ）
    const evs = events.filter(e => e.created_at <= now + R.futureSkew).slice().sort((a, b) => a.created_at - b.created_at || (a.id < b.id ? -1 : 1));
    const S = {users: {}, reqs: {}, links: {}, circles: {}, log: []};
    const pairs = new Set();    // 一度つながった持ち主どうし（同じ2人は1回だけ）
    const U = pk => S.users[pk] || (S.users[pk] = {pk, name: "", tickets: 0, starter: false, gifted: 0, gotGift: 0, gave: 0, helped: 0, got: 0, judged: 0, judgedOk: 0, flaggedAsks: 0, flaggedReviews: 0, linked: 0, lastReviewed: null, joined: null});
    const holding = pk => Object.values(S.reqs).filter(r => r.status === "taken" && r.taker === pk).length;
    const live = r => r && !["cancelled", "hidden"].includes(r.status);
    // 保険の借り：有効なときだけ。券が1枚未満で借りがなく、待っている依頼がどこにもないとき。券は負になり、次にもらう券で返る
    const canBorrow = u => R.borrow && u.tickets >= 0 && u.tickets < 1 && !Object.values(S.reqs).some(r => r.status === "open");
    const circleOf = id => Object.values(S.circles).find(c => c.reqs.includes(id));
    function tick(t) {   // 時間で決まる移り変わり
      for (const l of Object.values(S.links)) if (l.status === "pending" && t > l.at + R.linkDays * DAY) l.status = "expired";
      for (const r of Object.values(S.reqs)) {
        // 非公開で、持ち主から中身のかぎが届かないまま期限が来たら、引き受けた人に印をつけずに戻す
        if (r.status === "taken" && r.private && !r.shares[r.taker]) { if (t > r.takenAt + R.writeDays * DAY) { r.status = "open"; r.taker = null; } }
        else if (r.status === "taken" && t > (r.private ? r.sharedAt : r.takenAt) + R.writeDays * DAY) { (r.lapsedBy = r.lapsedBy || []).push(r.taker); U(r.taker).lapses = (U(r.taker).lapses || 0) + 1; r.status = "open"; r.taker = null; r.lapsed = (r.lapsed || 0) + 1; }
        else if (r.status === "given" && t > r.givenAt + R.judgeDays * DAY) finish(r, true, r.givenAt + R.judgeDays * DAY, true);
      }
    }
    function finish(r, ok, t, auto) {
      r.status = "done"; r.ok = ok; r.doneAt = t; r.auto = !!auto;
      const tk = U(r.taker), by = U(r.by);
      tk.gave++; by.got++;
      // 券は依頼のときに1枚なくなり、返事のときに新しく出る（譲り渡しではない）。
      // 役に立った → 書いた人に券1枚。いまひとつ → 書いた人と依頼した人に半券ずつ（半券2枚で券1枚）。
      // 危ない・ひどいレビュー → 書いた人には何もなし、依頼した人には半券（いまひとつと同じ。返事の選び方が券で左右されないように）
      if (ok) { tk.tickets++; tk.helped++; }
      else { by.tickets += 0.5; by.halfBack = (by.halfBack || 0) + 1; if (!r.flaggedReview) { tk.tickets += 0.5; tk.halves = (tk.halves || 0) + 1; } }
      if (!auto) { by.judged++; if (ok) by.judgedOk++; }
      tk.lastReviewed = r.by;
    }
    for (const e of evs) {
      let c; try { c = JSON.parse(e.content); } catch (x) { continue; }
      if (!c || typeof c !== "object") continue;
      tick(e.created_at);
      const u = U(e.pubkey);
      if (!u.joined) { u.joined = e.created_at; if (e.created_at <= R.starterUntil && (!STARTERS || STARTERS.includes(e.pubkey))) { u.starter = true; u.tickets += R.start; } }
      const r = c.req && S.reqs[c.req];
      let ok = false;
      if (c.t === "hello" && typeof c.name === "string") { u.name = c.name.slice(0, 24); ok = true; }
      // 紹介：「役に立った」をもらったことのある人が、自分の券を1枚、ほかの人に贈る（券は増えない）
      else if (c.t === "gift" && isHex(c.to, 64) && c.to !== e.pubkey && u.helped >= 1 && u.tickets >= 1) { u.tickets--; u.gifted++; const v = U(c.to); v.tickets++; v.gotGift++; ok = true; }
      else if (c.t === "ask" && (u.tickets >= 1 || canBorrow(u)) && genresOf(c).length && (c.private === true
                 ? isSealed(c.sealed) && isHex(c.n, 32) && String(c.hint || "").trim()
                 : /^https:\/\/\S+$/.test(c.link || "") && String(c.ask || "").trim())) {
        u.tickets--;
        const base = {id: e.id, by: e.pubkey, at: e.created_at, genres: genresOf(c), want: WANTS.includes(c.want) ? c.want : "any", aiName: String(c.aiName || "").slice(0, 60), status: "open", taker: null};
        S.reqs[e.id] = c.private === true
          ? {...base, private: true, hint: String(c.hint).trim().slice(0, 80), sealed: c.sealed, n: c.n, shares: {}, link: "", ask: ""}
          : {...base, private: false, link: c.link.slice(0, 300), ask: String(c.ask).slice(0, 400)};
        ok = true;
      }
      // 取り下げ：待っている依頼だけ。集まりに入った依頼は、取り下げても券は戻らない
      // （依頼を出す→つないでもらう→取り下げて券を戻す、をくり返して、つないだ人の券を作り出すのを防ぐ）
      else if (c.t === "cancel" && r && r.by === e.pubkey && r.status === "open") { r.status = "cancelled"; if (!circleOf(r.id)) u.tickets++; else r.noRefund = true; ok = true; }
      else if (c.t === "take" && r && r.status === "open" && r.by !== e.pubkey && e.created_at >= r.at && U(r.by).lastReviewed !== e.pubkey
               && !(r.lapsedBy || []).includes(e.pubkey) && holding(e.pubkey) < (u.helped >= 1 ? R.holdMax : R.newHoldMax)) {
        r.status = "taken"; r.taker = e.pubkey; r.takenAt = e.created_at; r.sharedAt = null; ok = true;
      }
      // 非公開：持ち主が、引き受けた人だけに中身のかぎを渡す（ふたりのかぎで包んである）
      else if (c.t === "share" && r && r.private && r.by === e.pubkey && r.status === "taken" && c.to === r.taker && !r.shares[c.to] && isSealed(c.key)) {
        r.shares[c.to] = c.key; r.sharedAt = e.created_at; ok = true;
      }
      // 非公開の依頼を公開する（持ち主だけ）。中身のかぎをそのまま出す
      else if (c.t === "reveal" && r && r.private && r.by === e.pubkey && !r.revealed && live(r) && isHex(c.key, 64)) { r.revealed = true; r.openKey = c.key; ok = true; }
      // 非公開のレビューを公開する（書いた人だけ。依頼が公開されたあと）
      else if (c.t === "open-review" && r && r.private && r.revealed && r.taker === e.pubkey && r.sealedReview && !r.reviewKey && isHex(c.key, 64)) { r.reviewKey = c.key; ok = true; }
      else if (c.t === "release" && r && r.status === "taken" && r.taker === e.pubkey) { r.status = "open"; r.taker = null; ok = true; }
      else if (c.t === "give" && r && r.status === "taken" && r.taker === e.pubkey
               && (r.private ? r.shares[e.pubkey] && isSealed(c.sealed) && isSealed(c.keyFor) : c.body && typeof c.body === "object")) {
        r.status = "given"; r.givenAt = e.created_at; r.reviewId = e.id; ok = true;
        if (r.private) { r.sealedReview = c.sealed; r.keyFor = c.keyFor; r.body = null; r.used = ""; }
        else { r.used = String(c.used || "").slice(0, 60); r.body = c.body; }
      }
      else if (c.t === "judge" && r && r.status === "given" && r.by === e.pubkey) { finish(r, !!c.ok, e.created_at); ok = true; }
      // つなぐ：「この依頼とこの依頼は合いそう」。提案できるのは「役に立った」をもらったことのある人で、どちらの持ち主でもない人。
      // 2つのうち少なくとも1つは、自分がレビューを届けたことのある依頼（中身をよく知っている人がつなぐ）
      else if (c.t === "link" && live(S.reqs[c.a]) && live(S.reqs[c.b]) && c.a !== c.b && u.helped >= 1 && (seen(S.reqs[c.a], e.pubkey) || seen(S.reqs[c.b], e.pubkey))) {
        const A = S.reqs[c.a], B = S.reqs[c.b], key = [A.by, B.by].sort().join(":");
        const ca = circleOf(A.id), cb = circleOf(B.id);
        if (A.by !== B.by && e.pubkey !== A.by && e.pubkey !== B.by && !pairs.has(key) && !(ca && ca === cb)) {
          S.links[e.id] = {id: e.id, by: e.pubkey, at: e.created_at, a: A.id, b: B.id, owners: [A.by, B.by], why: String(c.why || "").slice(0, 300), yes: [], status: "pending"};
          ok = true;
        }
      }
      // 受ける・断る：両方の持ち主が受けると成立。つないだ人に券が1枚入り、集まりができる（すでにあれば広がる）
      else if (c.t === "answer" && S.links[c.link] && S.links[c.link].status === "pending" && S.links[c.link].owners.includes(e.pubkey) && !S.links[c.link].yes.includes(e.pubkey)) {
        const l = S.links[c.link]; ok = true;
        if (!c.ok) l.status = "declined";
        else {
          l.yes.push(e.pubkey);
          if (l.yes.length === 2) {
            const key = l.owners.slice().sort().join(":");
            if (pairs.has(key)) l.status = "expired";
            else {
              pairs.add(key); l.status = "joined"; l.joinedAt = e.created_at;
              const p = U(l.by); p.tickets++; p.linked++;
              let ca = circleOf(l.a), cb = circleOf(l.b);
              if (!ca && !cb) { ca = S.circles[l.id] = {id: l.id, at: e.created_at, reqs: [], members: [], links: [], status: "active"}; }
              const C = ca || cb;
              if (ca && cb && ca !== cb) { for (const x of cb.reqs) C.reqs.includes(x) || C.reqs.push(x); for (const x of cb.members) C.members.includes(x) || C.members.push(x); C.links.push(...cb.links); delete S.circles[cb.id]; }
              for (const x of [l.a, l.b]) C.reqs.includes(x) || C.reqs.push(x);
              for (const x of [...l.owners, l.by]) C.members.includes(x) || C.members.push(x);
              C.links.push(l.id);
            }
          }
        }
      }
      // できた：集まりの仲間が、形になったもののリンクを出す。別の仲間が1人「確かに」と押せば完結
      else if (c.t === "made" && S.circles[c.circle] && S.circles[c.circle].status === "active" && S.circles[c.circle].members.includes(e.pubkey) && /^https:\/\/\S+$/.test(c.url || "")) {
        Object.assign(S.circles[c.circle], {status: "made", madeBy: e.pubkey, url: c.url.slice(0, 300), what: String(c.what || "").slice(0, 300), madeAt: e.created_at}); ok = true;
      }
      else if (c.t === "confirm" && S.circles[c.circle] && S.circles[c.circle].status === "made" && S.circles[c.circle].members.includes(e.pubkey) && S.circles[c.circle].madeBy !== e.pubkey) {
        Object.assign(S.circles[c.circle], {status: "complete", confirmedBy: e.pubkey, doneAt: e.created_at}); ok = true;
      }
      // 危ない依頼（悪意のあるアプリへの誘導など）：「役に立った」をもらったことのある人が R.hideFlags 人つけると、だれの画面からも消える。券は戻らない
      // 非公開の依頼は中身を見られるのが引き受けた人だけなので、知らせられるのは、かぎを受け取った人（実績のある人）。
      // 公開と同じく R.hideFlags 人そろって消える。知らせた人が引き受け中なら手放したことにして、ほかの人が確かめられるようにする
      else if (c.t === "flag" && c.what === "ask" && r && r.by !== e.pubkey && u.helped >= 1 && ["open", "taken"].includes(r.status) && !(r.flags || []).includes(e.pubkey)
               && (!r.private || r.revealed || r.shares[e.pubkey])) {
        (r.flags = r.flags || []).push(e.pubkey); ok = true;
        if (r.status === "taken" && r.taker === e.pubkey) { r.status = "open"; r.taker = null; }
        if (r.flags.length >= R.hideFlags) { r.status = "hidden"; r.taker = null; U(r.by).flaggedAsks++; }
      }
      // 危ない・ひどいレビュー：依頼した人がつける。券も半券も入らず、書いた人に印が残る
      else if (c.t === "flag" && c.what === "review" && r && r.status === "given" && r.by === e.pubkey) {
        r.flaggedReview = true; finish(r, false, e.created_at); U(r.taker).flaggedReviews++; ok = true;
      }
      S.log.push({id: e.id, pk: e.pubkey, at: e.created_at, t: c.t, req: c.req || (c.t === "ask" ? e.id : null), ok});
    }
    tick(now);
    return S;
  }

  // 集まりの貢献の記録：だれが、どの依頼を出し、どれを見て、どれをつないだか
  function contributions(S, cid) {
    const C = S.circles[cid]; if (!C) return [];
    const by = {};
    const add = (pk, k) => { (by[pk] = by[pk] || {pk, asked: 0, reviewed: 0, linked: 0, made: 0})[k]++; };
    for (const id of C.reqs) { const r = S.reqs[id]; if (!r) continue; add(r.by, "asked"); if (r.status === "done" && r.taker) add(r.taker, "reviewed"); }
    for (const id of C.links) { const l = S.links[id]; if (l) add(l.by, "linked"); }
    if (C.madeBy) add(C.madeBy, "made");
    return Object.values(by);
  }

  // pk がレビューを届けたことのある依頼か（つなぐの条件）
  const seen = (r, pk) => !!r && r.taker === pk && ["given", "done"].includes(r.status);
  const api = {STARTERS, seen, reduce, contributions, R, GENRES, WANTS, gen, genresOf, minutes, fields, DAY};
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Rules = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>
"use strict";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => Math.floor(Date.now() / 1000);
// 言葉：端末の言語が日本語なら日本語、それ以外は英語（#en / #ja で切り替えて確かめられる）。どちらでも同じ依頼が回る
const LANG = /#.*\ben\b/.test(location.hash) ? "en" : /#.*\bja\b/.test(location.hash) ? "ja" : /^ja\b/i.test(navigator.language || "ja") ? "ja" : "en";
const t = (s, v) => { let o = LANG === "en" && EN[s] != null ? EN[s] : s; if (v) for (const k in v) o = o.split("{" + k + "}").join(v[k]); return o; };
document.documentElement.lang = LANG;
$$("[data-t]").forEach(el => { el.textContent = t(el.textContent); }); document.title = t("相互レビュー");
const KIND = 7710, TAG = "sougo-review";
const RELAYS = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.nostr.band"];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- かぎ（端末の中だけ） ---------- */
let me = store.get("sougo.me", null);          // {sk, pk, name}
let mode = "live";                               // live / demo（見本は #demo のときだけ）
let events = [], S = null, note = null, skipped = new Set(store.get("sougo.skip", []));

/* ---------- 出来事の置き場所 ---------- */
const bucket = () => mode === "demo" ? "sougo.demo" : "sougo.live";
function loadEvents() { events = store.get(bucket(), []); }
function saveEvents() { store.set(bucket(), events.slice(-8000)); }
function addEvent(ev) { if (events.some(e => e.id === ev.id)) return false; events.push(ev); saveEvents(); return true; }
function recompute() { S = Rules.reduce(events.filter(e => e.kind === KIND), now()); }

/* ---------- リレー（Nostr） ---------- */
const sockets = [];
let verified = new Set(store.get("sougo.ok", []));
async function accept(ev) {
  if (!ev || ev.kind !== KIND || !(ev.tags || []).some(t => t[0] === "t" && t[1] === TAG)) return;
  if (!verified.has(ev.id)) { if (!(await Sig.verifyEvent(ev))) return; verified.add(ev.id); store.set("sougo.ok", [...verified].slice(-5000)); }
  if (addEvent(ev)) schedule();
}
let t0;
function schedule() { clearTimeout(t0); t0 = setTimeout(() => { recompute(); live(); }, 150); }
// 中継につなぐ。つながらなくても本番のまま動き、出したものは、つながったときに送る（見本には自動で切り替えない）
let quietUntil = Date.now() + 8000;   // 開いた直後は、古い出来事を読み込む途中で券の数が動くので「増えました」を出さない
function connectOne(url, wait) {
  let ws; try { ws = new WebSocket(url); } catch (e) { return; }
  ws.onopen = () => { wait = 2000; ws.send(JSON.stringify(["REQ", "sr", {kinds: [KIND], "#t": [TAG], limit: 500}])); flush(); netStatus(); };
  // 古い出来事もすべて読む（500件ずつさかのぼる）。全部読まないと、券の数が人によってずれる
  let oldest = Infinity, got = 0, page = 0;
  ws.onmessage = m => { try { const d = JSON.parse(m.data);
    if (d[0] === "EVENT") { got++; if (d[2] && d[2].created_at < oldest) oldest = d[2].created_at; accept(d[2]); }
    if (d[0] === "EOSE") { quietUntil = Math.max(quietUntil, Date.now() + 3000); if (got >= 500 && page < 40) { page++; got = 0; ws.send(JSON.stringify(["REQ", "sr" + page, {kinds: [KIND], "#t": [TAG], until: oldest - 1, limit: 500}])); } }
  } catch (e) {} };
  // 切れたら（電波が弱い、画面を閉じていた）間をあけてつなぎ直す
  ws.onclose = () => { const i = sockets.indexOf(ws); if (i >= 0) sockets.splice(i, 1); setTimeout(netStatus, 50); setTimeout(() => connectOne(url, Math.min((wait || 2000) * 2, 60000)), wait || 2000); };
  ws.onerror = () => {};
  sockets.push(ws);
}
function connect() { if ("WebSocket" in window) for (const url of RELAYS) connectOne(url, 2000); }
const openSockets = () => sockets.filter(s => s.readyState === 1);
let outbox = store.get("sougo.outbox", []);
function flush() {
  const os = openSockets(); if (!os.length) return;
  for (const ev of outbox) for (const s of os) s.send(JSON.stringify(["EVENT", ev]));
  outbox = []; store.set("sougo.outbox", outbox);
}
function toLive() { mode = "live"; loadEvents(); recompute(); netStatus(); render(); sync(); }
function toDemo() { mode = "demo"; loadEvents(); seedDemo().then(() => { recompute(); netStatus(); render(); sync(); }); }
function netStatus() {
  const n = $("#net"), on = mode === "live" && openSockets().length > 0;
  n.className = "status" + (on ? " on" : "");
  n.title = t(on ? "つながっています" : mode === "demo" ? "見本をやめる" : "つないでいます");
  n.lastChild.textContent = mode === "demo" ? t("見本") + " ×" : on ? "" : t("つないでいます");
  if (mode === "demo") { n.dataset.act = "undemo"; n.setAttribute("role", "button"); n.style.cursor = "pointer"; }
}

// 端末がこのページの記録を勝手に消さないよう頼む（できるブラウザだけ）
function keepStorage() { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} }
// X や LINE などのアプリの中のブラウザは、閉じると記録が消えることがある
const inApp = /(Twitter|FBAN|FBAV|Instagram|Line\/|LINE|micromessenger)/i.test(navigator.userAgent || "") && !/Safari\/[\d.]+$/.test(navigator.userAgent || "") || /\bwv\b/.test(navigator.userAgent || "");

/* ---------- 出す ---------- */
async function emit(c) {
  // 同じ秒に続けて出すと順番が入れ替わるので、自分の出来事は必ず前より後の時刻にする
  // すぐに返す出来事（かぎを渡すなど）が、きっかけの出来事と同じ秒にならないよう、直前の出来事より後にする
  const last = events.filter(e => e.pubkey === me.pk).reduce((m, e) => Math.max(m, e.created_at), 0);
  const at = Math.max(nextAt(), last + 1);
  const ev = await Sig.signEvent({kind: KIND, tags: [["t", TAG]], content: JSON.stringify(c), created_at: at}, me.sk);
  addEvent(ev); verified.add(ev.id);
  if (mode === "live") { outbox.push(ev); store.set("sougo.outbox", outbox); flush(); }
  recompute();
  if (mode === "demo") demoReact(c, ev);
  sync();
  return ev;
}

/* ---------- 非公開：読めるものを開き、引き受けた人にかぎを渡す ---------- */
const plain = {}, rplain = {}, tried = {};   // 依頼の中身 / レビューの中身（この端末の中だけ）
async function askKey(r, sk, pk) {
  if (r.openKey) return Seal.unhex(r.openKey);
  if (r.by === pk) return Seal.contentKey(sk, r.n);
  if (r.shares[pk]) { const o = await Seal.open(await Seal.pairKey(sk, r.by), r.shares[pk], `share:${r.id}:${pk}`); return o && Seal.unhex(o.k); }
  return null;
}
async function reviewKey(r, sk, pk) {
  if (r.reviewKey) return Seal.unhex(r.reviewKey);
  if (r.by !== pk && r.taker !== pk) return null;
  const o = await Seal.open(await Seal.pairKey(sk, r.by === pk ? r.taker : r.by), r.keyFor, `rk:${r.id}`); return o && Seal.unhex(o.k);

  ["人もAIも", "だれが書いても券は同じ1枚です。依頼するときに、人かAIか希望を出せます。"],
  ["公開と非公開", "公開の依頼とレビューは、だれでも読めます。非公開の中身は引き受けた人だけ、レビューは依頼した人だけが読めます。あとから公開もできます（レビューは書いた人が許したときだけ）。読んだ人が書き写すことまでは防げません。"],
  ["言葉", "依頼もレビューも、書いた人の言葉のまま届きます。言葉の違う人どうしでも、同じ依頼が回ります。"],
  ["保留", "気になる依頼に印をつけておけます。印はこの端末の中だけにあります。"],
  ["つなぐ", "「役に立った」をもらったことのある人は、合いそうな2つの依頼をつなげます。1つは自分がレビューを届けた依頼です。両方の持ち主が受けると集まりができ、つないだ人に券が1枚入ります。"],
  ["集まりと、できた", "形になったら仲間が「できた」を出し、ほかの仲間が「確かに」と押すと完結します。だれが依頼し、見て、つなぎ、形にしたかが残ります。"],
  ["記録", "出来事はすべて署名つきで残り、毎日ビットコインに刻まれます（OpenTimestamps）。証明するのは「その時点で存在したこと」だけで、権利を与えるものではありません。"],
  ["安全のために", "見るときは、ウォレットをつながない・署名しない・かぎを入れない。危ない依頼は、実績のある2人が知らせると消えます（非公開は中身を受け取った人どうし）。ひどいレビューには券が入りません。直前に見てくれた人の依頼は回ってきません。"],
  ["使わないこと", "特許や独占的な権利がほしいもの、ストアの星や推薦文の交換、お金のやり取り（券の売り買いも）。"],
  ["決まりを変えるとき", "変えた日と中身を、だれでも読める変更記録（CHANGES.md）に残します。"],
  ["運営がいない", "出来事は端末で署名され、だれでも使える中継（Nostr）に置かれます。券の数は、だれの画面でも同じ決まりで数え直されます。"],
  ["試験版です", "知らせが届くのは、アプリを開いている間だけです。かぎをなくすと、券も非公開の中身も戻せません。中継が止まったり古い記録を消したりすることがあります。決まりは変わることがあり、変えたときは変更記録に残します。"],
];
const howHtml = () => `<h2>${t("しくみ")}</h2><div class="how" style="display:grid;gap:16px">${HOW.map(([h, b]) => `<div><h4>${t(h)}</h4><p>${t(b, {w: Rules.R.writeDays, j: Rules.R.judgeDays})}</p></div>`).join("")}</div>`;
let histN = 50;
const T = {hello: "名前", ask: "依頼", take: "引き受け", give: "届けた", judge: "返事", cancel: "取り下げ", release: "手放した", flag: "知らせた", link: "つないだ", answer: "つなぎに返事", made: "できた", confirm: "確かに", share: "中身を渡した", reveal: "公開した", "open-review": "レビューを公開", gift: "券を贈った"};
function meHtml() {
  const all = S.log.filter(l => l.pk === me.pk).reverse(), list = all.slice(0, histN), u = mine();
  return `<h2>${t("記録とかぎ")}</h2>
    <div class="job"><span>${t("見てあげた {g}・役に立った {h}・見てもらった {r}", {g: u.gave || 0, h: u.helped || 0, r: u.got || 0})}</span>${u.judged ? `<span class="small">${t("役に立ったを返した割合 {n}%", {n: Math.round(100 * u.judgedOk / u.judged)})}</span>` : ""}</div>
    <div class="job"><b>${t("かぎ")}</b><span class="small">${t("記録も非公開の中身も、このかぎで開きます。書き写して保管してください。人に見せると、なりすまされます。")}</span>
      <details ontoggle="if(this.open){try{localStorage.setItem('sougo.backed','1')}catch(e){}}"><summary class="small" style="cursor:pointer">${t("表示する")}</summary><p class="mono" style="margin:8px 0 0">${me.sk}</p></details>
      <input id="imp" placeholder="${t("別の端末のかぎ（64文字）")}" aria-label="${t("別の端末のかぎ")}" autocomplete="off"><button type="button" data-act="import">${t("このかぎで続ける")}</button></div>
    <div><h3 style="margin-top:0">${t("あなたの出来事（{n}）", {n: all.length})}</h3>${list.length ? list.map(l => { const q = l.req && S.reqs[l.req];
        return `<div class="hist" ${q ? `data-act="${q.by === me.pk ? "mine" : "view"}" data-id="${q.id}" role="button" tabindex="0" style="cursor:pointer"` : ""}><span>${T[l.t] ? t(T[l.t]) : esc(l.t)}${l.ok ? "" : t("（無効）")}${q ? `<br><span class="small">${esc(titleOf(q).slice(0, 24))}</span>` : ""}</span><span class="small" style="white-space:nowrap">${new Date(l.at * 1000).toLocaleString(LANG === "ja" ? "ja-JP" : "en-US", {dateStyle: "short", timeStyle: "short"})}</span></div>`; }).join("") : `<p class="empty">${t("まだありません")}</p>`}
      ${all.length > histN ? `<button type="button" class="link" data-act="more">${t("もっと前（{n}）", {n: all.length - histN})}</button>` : ""}</div>
    <div class="job"><b>${t("番号")}</b><span class="small">${t("紹介してくれる人に伝えると、券を贈ってもらえます。見せても大丈夫です。")}</span><p class="mono" style="margin:0" id="my-pk">${me.pk}</p><button type="button" data-act="copy-pk">${t("番号を写す")}</button></div>
    ${(u.helped || 0) >= 1 ? `<div class="job"><b>${t("券を贈る")}</b><input id="g-to" placeholder="${t("相手の番号（64文字）")}" aria-label="${t("相手の番号")}" autocomplete="off"><p class="small" id="g-msg" style="margin:0;color:var(--warm)" role="alert"></p><button type="button" data-act="gift" ${u.tickets >= 1 ? "" : "disabled"}>${t("贈る（券1枚）")}</button></div>` : ""}`;
}

// 横に払うと戻る（左右どちらでも）
(() => {
  const p = $("#panel"); let x0 = 0, y0 = 0, dx = 0, track = null;
  p.addEventListener("touchstart", e => { const tc = e.touches[0]; x0 = tc.clientX; y0 = tc.clientY; dx = 0; track = null; }, {passive: true});
  p.addEventListener("touchmove", e => { const tc = e.touches[0], mx = tc.clientX - x0, my = tc.clientY - y0;
    if (track === null && (Math.abs(mx) > 10 || Math.abs(my) > 10)) track = Math.abs(mx) > Math.abs(my) * 1.4;
    if (!track) return; dx = mx; p.style.transition = "none"; p.style.transform = `translateX(${dx}px)`; }, {passive: true});
  p.addEventListener("touchend", () => { if (!track) return; p.style.transition = "";
    if (Math.abs(dx) > 70) { p.style.transform = `translateX(${dx > 0 ? 100 : -100}%)`; setTimeout(closePanel, 220); } else p.style.transform = ""; });
})();

/* ---------- 操作 ---------- */
const bad = (sel, msg) => { const el = $(sel); el.style.borderColor = "var(--warm)"; el.focus(); if (msg) $("#a-msg").textContent = msg; };
const accepted = ev => { const l = S.log.find(x => x.id === ev.id); return !!(l && l.ok); };   // 出した出来事が決まりに合って数えられたか
const skip = id => { skipped.add(id); store.set("sougo.skip", [...skipped]); };
async function act(a, id) {
  const r = id && S && S.reqs[id];
  if (a === "start") {
    const name = ($("#nm").value || "").trim(); if (!name) return $("#nm").focus();
    // 同じ呼び名の人がもういる：前に使っていた本人なら、新しく始めずに「かぎで続ける」を勧める（端末やブラウザが変わると別の人になるため）
    if (S && Object.values(S.users).some(u => u.name === name) && $("#nm").dataset.ok !== name) {
      $("#nm").dataset.ok = name; $("#st-msg").textContent = t("「{n}」という呼び名の人がもういます。前に使っていた本人なら、下の「かぎで続ける」から。別の人なら、もう一度「はじめる」を押してください。", {n: name}); $("#st-key").hidden = false; return;
    }
    const sk = Sig.newKey(); me = {sk, pk: Sig.hex(Sig.pubkey(Sig.unhex(sk))), name}; store.set("sougo.me", me); keepStorage();
    await emit({t: "hello", name}); render();
    return;
  }
  if (a === "show-key") { $("#st-key").hidden = false; return $("#st-imp").focus(); }
  if (a === "start-import") {
    const k = ($("#st-imp").value || "").trim().toLowerCase(); let pk = null;
    try { if (/^[0-9a-f]{64}$/.test(k)) pk = Sig.hex(Sig.pubkey(Sig.unhex(k))); } catch (e) {}
    if (!pk) { $("#st-imp").style.borderColor = "var(--warm)"; return $("#st-imp").focus(); }
    me = {sk: k, pk, name: S && S.users[pk] && S.users[pk].name || ""}; store.set("sougo.me", me); keepStorage(); render(); return sync();
  }
  if (a === "demo" || a === "undemo") { location.hash = a === "demo" ? "#demo" : ""; return location.reload(); }
  if (a === "dismiss") { note = null; $("#note").innerHTML = ""; return; }
  if (a === "back") return closePanel();
  if (a === "how") return openPanel("how", null, howHtml());
  if (!me || !S) return;
  if (a === "me") { histN = 50; return openPanel("me", null, meHtml()); }
  if (a === "more") { const b = $(".panel .body"), y = b.scrollTop; histN += 100; $("#pbody").innerHTML = meHtml(); b.scrollTop = y; return; }
  if (a === "view" && r) return openPanel("view", id, viewHtml(r));
  if ((a === "watch" || a === "unwatch") && r) { setWatch(id, a === "watch"); live(); return openPanel("view", id, viewHtml(r)); }
  if (a === "watch-next" && r) { setWatch(id, true); skip(id); note = {m: t("保留しました")}; render(); return openPanel("give", null, giveHtml()); }
  if (a === "ask") return openPanel("ask", null, askHtml());
  if (a === "give") return openPanel("give", null, giveHtml());
  if (a === "write" && r) return openPanel("write", id, writeHtml(r));
  if (a === "judge" && r) return openPanel("judge", id, judgeHtml(r));
  if (a === "mine" && r) return openPanel("mine", id, mineHtml(r));
  if (a === "unskip") { skipped.clear(); store.set("sougo.skip", []); return openPanel("give", null, giveHtml()); }
  if (a === "skip") { skip(id); return openPanel("give", null, giveHtml()); }
  if (a === "send-ask" || a === "take") askNotify();
  if (a === "send-ask") {
    const link = $("#a-link").value.trim(), ask = $("#a-ask").value.trim(), hint = $("#a-hint").value.trim();
    if (!/^https:\/\/\S+$/.test(link)) return bad("#a-link", t("リンクは https:// から"));
    if (!pick.genres.length) { $("#a-msg").textContent = t("見てほしい所を選んでください"); return; }
    if (!ask) return bad("#a-ask", t("見てほしい点を書いてください"));
    if (pick.priv && !hint) return bad("#a-hint", t("みんなに見せるひとことを書いてください"));
    const base = {genres: pick.genres, want: pick.want, aiName: pick.want === "ai" ? ($("#a-ai").value || "").trim() : ""};
    const ev = await emit(pick.priv ? {...await sealedAsk(me.sk, {link, ask, hint, ...base})} : {t: "ask", link, ask, ...base});
    closePanel(); note = accepted(ev) ? {m: t("依頼を出しました")} : {k: "warn", m: t("出せませんでした（券がありません）")}; return render();
  }
  if (a === "take" && r) { await emit({t: "take", req: id}); const rr = S.reqs[id];
    if (rr.taker !== me.pk) { note = {k: "warn", m: t("いまは引き受けられません（先に引き受けた人がいるか、同時に持てる数を超えています）")}; render(); return openPanel("give", null, giveHtml()); }
    render(); return openPanel("write", id, writeHtml(rr)); }
  if (a === "release" && r) { await emit({t: "release", req: id}); closePanel(); note = {m: t("手放しました")}; return render(); }
  if (a === "send-give" && r) {
    const body = {}; let filled = 0;
    $$("#pbody [data-field]").forEach(el => { body[el.dataset.field] = el.value.trim(); if (el.value.trim()) filled++; });
    if (filled < 2) { $("#w-msg").textContent = t("2つ以上の欄を書いてください"); const x = $$("#pbody [data-field]").find(y => !y.value.trim()); x && x.focus(); return; }
    const used = ($("#w-used").value || "").trim();
    const ev = await emit(r.private ? await sealedGive(me.sk, r, body, used) : {t: "give", req: id, used, body});
    if (!accepted(ev)) { $("#w-msg").textContent = t("届けられませんでした（期限が過ぎたか、ほかの人に移りました）"); return; }
    closePanel(); note = {m: t("届けました")}; return render();
  }
  if ((a === "judge-ok" || a === "judge-no") && r) { await emit({t: "judge", req: id, ok: a === "judge-ok"}); closePanel(); note = {m: t("返事をしました")}; return render(); }
  if (a === "cancel" && r) { await emit({t: "cancel", req: id}); closePanel(); note = {m: t(inCircle(id) ? "取り下げました" : "取り下げました。券が戻りました")}; return render(); }
  if (a === "reveal" && r) { await emit({t: "reveal", req: id, key: Seal.hex(await Seal.contentKey(me.sk, r.n))}); note = {m: t("公開しました")}; render(); return openPanel("mine", id, mineHtml(S.reqs[id])); }
  if (a === "open-review" && r) { const k = await reviewKey(r, me.sk, me.pk); if (k) await emit({t: "open-review", req: id, key: Seal.hex(k)}); render(); return openPanel("view", id, viewHtml(S.reqs[id])); }
  if (a === "keep-review" && r) { store.set("sougo.keepPriv", [...store.get("sougo.keepPriv", []), id]); closePanel(); return render(); }
  const L = id && S.links[id], C = id && S.circles[id];
  if (a === "linkfrom" && r) { linkPick = null; return openPanel("link", id, linkHtml(r)); }
  if (a === "pick") { linkPick = id; const why = $("#l-why").value; $("#pbody").innerHTML = linkHtml(S.reqs[openId]); $("#l-why").value = why; return; }
  if (a === "send-link") { if (!linkPick) { $("#l-msg").textContent = t("つなぐ相手を選んでください"); return; }
    const ev = await emit({t: "link", a: id, b: linkPick, why: ($("#l-why").value || "").trim()}); closePanel();
    note = accepted(ev) ? {m: t("提案しました")} : {k: "warn", m: t("この2つはつなげません（すでにつないだ2人か、決まりに合いません）")}; return render(); }
  if (a === "answer" && L) return openPanel("answer", id, answerHtml(L));
  if ((a === "answer-ok" || a === "answer-no") && L) { await emit({t: "answer", link: id, ok: a === "answer-ok"}); closePanel(); note = {m: t(a === "answer-ok" ? "受けました" : "断りました")}; return render(); }
  if (a === "circle" && C) return openPanel("circle", id, circleHtml(C));
  if (a === "made" && C) { const url = $("#m-url").value.trim(); if (!/^https:\/\/\S+$/.test(url)) { $("#m-url").style.borderColor = "var(--warm)"; return $("#m-url").focus(); }
    await emit({t: "made", circle: id, url, what: ($("#m-what").value || "").trim()}); render(); return openPanel("circle", id, circleHtml(S.circles[id])); }
  if (a === "confirm" && C) { await emit({t: "confirm", circle: id}); note = {m: t("完結しました")}; render(); return openPanel("circle", id, circleHtml(S.circles[id])); }
  if (a === "flag-ask" && r) { await emit({t: "flag", what: "ask", req: id}); skip(id); note = {m: t(r.taker === me.pk ? "知らせて、手放しました" : "知らせました")}; render(); return openPanel("give", null, giveHtml()); }
  if (a === "flag-review" && r) { await emit({t: "flag", what: "review", req: id}); closePanel(); note = {m: t("知らせました。書いた人に券は入らず、あなたに半券が戻りました")}; return render(); }
  if (a === "copy-pk") { try { await navigator.clipboard.writeText(me.pk); } catch (e) { const r0 = document.createRange(); r0.selectNodeContents($("#my-pk")); getSelection().removeAllRanges(); getSelection().addRange(r0); } note = {m: t("番号を写しました")}; $("#note") && ($("#note").innerHTML = noteHtml()); return; }
  if (a === "gift") {
    const to = ($("#g-to").value || "").trim().toLowerCase();
    if (!/^[0-9a-f]{64}$/.test(to) || to === me.pk) { $("#g-msg").textContent = t("相手の番号（64文字）を入れてください"); return $("#g-to").focus(); }
    if ($("#g-to").dataset.ok !== to) { $("#g-to").dataset.ok = to; $("#g-msg").textContent = t("{n}に贈ります。もう一度押すと贈ります。", {n: S.users[to] ? nameOf(to) : t("まだ始めていない人")}); return; }
    const ev = await emit({t: "gift", to}); closePanel(); note = accepted(ev) ? {m: t("券を1枚贈りました")} : {k: "warn", m: t("贈れませんでした")}; return render();
  }
  if (a === "import") {
    const k = ($("#imp").value || "").trim().toLowerCase(); let pk = null;
    try { if (/^[0-9a-f]{64}$/.test(k)) pk = Sig.hex(Sig.pubkey(Sig.unhex(k))); } catch (e) {}
    if (!pk) { $("#imp").style.borderColor = "var(--warm)"; return; }
    me = {sk: k, pk, name: nameOf(pk).replace(/#.*$/, "")}; store.set("sougo.me", me); keepStorage(); closePanel(); render(); return sync();
  }
}
let pendingHello = null;
document.addEventListener("click", e => {
  const ch = e.target.closest && e.target.closest("[data-chip]");
  if (ch) {
    const k = ch.dataset.chip, v = ch.dataset.v;
    if (k === "genres") { const s = new Set(pick.genres); s.has(v) ? s.delete(v) : s.add(v); pick.genres = Rules.GENRES.map(g => g.id).filter(x => s.has(x)); ch.setAttribute("aria-pressed", String(s.has(v))); return; }
    if (k === "priv") { pick.priv = v === "priv"; $("#a-hint").hidden = !pick.priv; $("#a-note").textContent = pick.priv ? PRIV_NOTE : PUB_NOTE; }
    else { pick[k] = v; if (k === "want") $("#a-ai").hidden = v !== "ai"; }
    ch.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === ch)));
    return;
  }
  const t = e.target.closest && e.target.closest("[data-act]");
  if (t) act(t.dataset.act, t.dataset.id);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openKind) closePanel();
  if (e.key === "Enter" && e.target.matches && e.target.matches("[role=button][data-act]")) act(e.target.dataset.act, e.target.dataset.id);
});
setInterval(() => { if (S) { recompute(); live(); sync(); } if (mode === "live") flush(); netStatus(); }, 5000);
window.__sr = {act, get S() { return S; }, get me() { return me; }, get mode() { return mode; }, toDemo, plain, rplain, cleanAsk, cleanReview};

render();
if (/demo/.test(location.hash)) toDemo(); else { toLive(); connect(); }
