name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 署名（公式の試験ベクトル）
        run: node tests/sig.test.js
      - name: 決まり
        run: node --test tests/rules.test.js tests/seal.test.js
      - name: index.html が部品から作り直されているか
        run: python3 tools/build.py && git diff --exit-code index.html
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: 画面を操作して確かめる（スマホとパソコンの幅）
        run: node tests/app.e2e.js 400 && node tests/app.e2e.js 1200 && node tests/app.en.e2e.js 400 && node tests/app.live.e2e.js
      - name: パスキーと共通のアカウント（試験用の認証器）
        run: node tests/passkey.e2e.js
