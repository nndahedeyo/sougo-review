name: review

# 依頼が立ったとき・コメントが付いたとき・毎日1回、相互レビューの係（scripts/bot.py）が動く
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 記録（data/ledger.jsonl）を同時に書き換えないよう、1つずつ順番に動かす
concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  bot:
    if: github.event_name != 'issue_comment' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 依頼の目印を用意する
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create "依頼" --color 0E6B5C --description "レビューの依頼" 2>/dev/null || true
      - name: 係を動かす
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bot.py
      - name: 記録を残す
        run: |
          if ! git diff --quiet -- data/ledger.jsonl || [ -n "$(git status --porcelain data/ledger.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/ledger.jsonl
            git commit -m "記録：${{ github.event_name }} #${{ github.event.issue.number }}"
            git pull --rebase -q && git push -q
          fi
